[tox]
envlist = py3,doc,trixie,lint

[testenv]
passenv =
  TEST_DATABASE_URI
  TEST_LDAP_URI
deps =
  pytest-cov
  psycopg2-binary
  # Fix all version for Debian trixie
  trixie: sqlalchemy==2.0.40
  trixie: wtforms==3.2.1
  trixie: CherryPy==18.10.0
  trixie: configargparse==1.7
  trixie: Jinja2==3.1.6
extras = test
commands =
  pytest -v --debug --ignore=debian --override-ini junit_family=xunit1 --junit-xml=xunit.xml --cov=udb --cov-report xml:coverage.xml

[testenv:selenium]
allowlist_externals=
  /usr/bin/xvfb-run
extras = test
commands =
  xvfb-run pytest -v --debug --ignore=debian --junit-xml=xunit-selenium.xml --cov=udb --cov-report xml:coverage-selenium.xml

[testenv:lint]
deps = .[dev]
allowlist_externals = sh
commands = 
  black --check --diff src
  isort --check --diff src
  flake8 src
  sh -c 'djlint --check src/udb/templates/*.html src/udb/templates/**/*.html src/udb/components/*.jinja'
skip_install = true

[testenv:format]
deps = .[dev]
allowlist_externals = sh
commands =
  black src
  isort src
  sh -c 'djlint --reformat src/udb/templates/*.html src/udb/templates/**/*.html src/udb/components/*.jinja'
skip_install = true

[testenv:doc]
deps =
  sphinx
  myst-parser
commands = sphinx-build -W -b html -d {envtmpdir}/doctrees doc {envtmpdir}/html
skip_install = true

[testenv:changelog]
deps = 
  git-changelog
commands =
  git-changelog
  git-changelog --template "debian" --output "debian/changelog"
skip_install = true

# Bump version and git tag
[testenv:bump]
deps = 
  git-changelog
allowlist_externals =
  bash
  git
commands =
  git-changelog --bump auto {posargs}
  git-changelog --bump auto --template "debian" --output "debian/changelog" {posargs}
  # Create git tag
  git add CHANGELOG.md debian/changelog
  bash -c 'git commit -m "Release version $(git-changelog --bumped-version)"'
  bash -c 'git tag $(git-changelog --bumped-version)'
skip_install = true

[testenv:babel_extract]
deps =
  babel
  Jinja2
commands = pybabel extract -F babel.cfg --output-file src/udb/locales/messages.pot src
skip_install = true

[testenv:babel_init]
deps = babel
commands = pybabel init --domain messages --input-file src/udb/locales/messages.pot --output-dir src/udb/locales {posargs}
skip_install = true

[testenv:babel_update]
deps = babel
commands = pybabel update --domain messages --input-file src/udb/locales/messages.pot --output-dir src/udb/locales {posargs}
skip_install = true

[testenv:babel_compile]
deps = babel
commands = pybabel compile --domain messages --directory src/udb/locales
skip_install = true


domain = messages
directory = src/udb/locales

[flake8]
ignore =
  # whitespace before ':'
  E203
  # line too long (86 > 79 characters)
  E501
   # line break before binary operator
  W503
   # ambiguous variable name 'I'
  E741
copyright-check = True
copyright-min-file-size = 2
filename =
  *.py
max-complexity = 20
